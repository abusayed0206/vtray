[package]
name = "vt-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Low-resource Windows tray companion for manual VirusTotal checks"
license = "MIT"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
flexi_logger = "0.31.10"
hex = "0.4"
keyring = "4.2.0"
log = "0.4"
notify = "8.2.2"
notify-debouncer-full = "0.7.0"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2"
ureq = { version = "3.5.2", features = ["json"] }
winreg = "0.56.0"
zeroize = "1"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true


