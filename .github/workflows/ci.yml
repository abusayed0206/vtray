name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build, package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        id: package
        shell: pwsh
        run: |
          $version = (Select-String Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\vtray.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item target\release\VTray.exe "dist\VTray-$version-portable.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem dist | Format-Table Name, Length

      - name: Installer smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $app = "$env:LOCALAPPDATA\Programs\VT Tray"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VT Tray.lnk"
          $setup = Start-Process "dist\VTray-Setup-$version.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=""' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          if (-not (Test-Path "$app\VTray.exe")) { throw "VTray.exe not installed" }
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing" }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'VT Tray'
          if ($entry.Publisher -ne 'abusayed.dev' -or $entry.DisplayVersion -ne $version) { throw "Settings > Apps entry is wrong: $($entry | Out-String)" }
          $info = (Get-Item "$app\VTray.exe").VersionInfo
          if ($info.ProductName -ne 'VT Tray' -or $info.CompanyName -ne 'abusayed.dev') { throw "version info is wrong" }
          $uninstall = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "uninstall exited with $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          foreach ($left in @($app, $lnk)) { if (Test-Path $left) { throw "left behind after uninstall: $left" } }
          Write-Output "install and uninstall OK"

      - name: Idle memory and CPU budget (25 MB, 1%)
        run: cargo run --release --example memprobe -- 30

      - uses: actions/upload-artifact@v4
        with:
          name: vtray-${{ steps.package.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
